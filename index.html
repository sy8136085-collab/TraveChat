<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TraveChat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

  <style>
    body { font-family: 'Inter', sans-serif; }
    .chat-container { scrollbar-width: thin; scrollbar-color: #e5e7eb #f9fafb; }
    .message-bubble { max-width: 75%; padding: 14px 18px; border-radius: 20px; line-height: 1.4; }
    .user-bubble { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; border-bottom-right-radius: 4px; }
    .bot-bubble { background: #f1f5f9; color: #1e2937; border-bottom-left-radius: 4px; }
    .sidebar-link:hover { background-color: #f1f5f9; transform: translateX(4px); }
  </style>
</head>
<body class="bg-slate-50 text-slate-800">

  <div class="flex h-screen overflow-hidden">

    <!-- LEFT SIDEBAR -->
    <div class="w-72 bg-white border-r border-slate-200 flex flex-col">
      <div class="px-6 py-8 border-b border-slate-100 flex items-center gap-3">
        <img src="logo.png" alt="TraveChat" class="w-10 h-10 object-contain">
        <div class="text-3xl font-bold tracking-tight">
          <span class="text-blue-600">Trave</span><span class="text-slate-800">Chat</span>
        </div>
      </div>

      <div class="p-4 flex flex-col gap-2">
        <button onclick="newChat()" 
                class="flex items-center gap-3 px-5 py-4 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl font-medium">
          <i class="fas fa-plus"></i>
          <span>New Chat</span>
        </button>

        <div class="relative mt-4">
          <input id="searchInput" type="text" placeholder="Search chats..." 
                 class="w-full bg-slate-100 border border-slate-300 rounded-2xl px-5 py-3 text-sm outline-none"
                 onkeyup="filterHistory()">
        </div>

        <div class="mt-3 text-xs font-semibold text-slate-500 px-2">HISTORY</div>
        <div id="historyList" class="flex-1 overflow-y-auto px-2 space-y-1 text-sm"></div>
      </div>
    </div>

    <!-- MAIN CHAT AREA -->
    <div class="flex-1 flex flex-col">

      <!-- Top Bar -->
      <div class="h-16 border-b border-slate-200 bg-white flex items-center justify-between px-6">
        <div id="chatTitle" class="font-semibold text-lg">New Conversation</div>
        
        <!-- Login Section -->
        <div id="loginSection">
          <button onclick="showLoginModal()" 
                  class="flex items-center gap-2 bg-white border border-slate-300 hover:border-slate-400 px-6 py-2 rounded-2xl font-medium">
            <i class="fas fa-user"></i>
            <span>Login</span>
          </button>
        </div>

        <!-- User Section -->
        <div id="userSection" class="hidden items-center gap-3">
          <div id="userAvatar" class="w-8 h-8 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center font-semibold"></div>
          <div>
            <div id="userName" class="font-medium text-sm"></div>
            <div id="userEmail" class="text-xs text-slate-500"></div>
          </div>
          <button onclick="logout()" class="ml-4 text-slate-400 hover:text-red-500">
            <i class="fas fa-sign-out-alt"></i>
          </button>
        </div>
      </div>

      <!-- Chat Messages -->
      <div id="chatMessages" class="flex-1 overflow-y-auto chat-container p-6 space-y-6 bg-slate-50">
        <div class="flex flex-col items-center justify-center h-full text-center">
          <div class="text-6xl mb-4">✈️</div>
          <h2 class="text-2xl font-semibold text-slate-700">Welcome to TraveChat!</h2>
          <p class="text-slate-500 mt-2">Login karke travel ke baare mein poochho</p>
        </div>
      </div>

      <!-- Input Area -->
      <div class="p-6 bg-white border-t border-slate-200">
        <div class="flex gap-3">
          <input id="userInput" type="text" placeholder="Ask anything about travel..." 
                 class="flex-1 bg-slate-100 border border-slate-300 focus:border-blue-500 rounded-3xl px-6 py-4 outline-none"
                 onkeypress="if(event.key === 'Enter') sendMessage()">
          <button onclick="sendMessage()" 
                  class="bg-blue-600 hover:bg-blue-700 text-white w-14 h-14 rounded-3xl flex items-center justify-center">
            <i class="fas fa-paper-plane"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- LOGIN MODAL -->
  <div id="loginModal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50">
    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md p-8">
      <h3 class="text-2xl font-bold text-center mb-6">Login to TraveChat</h3>

      <button onclick="googleLogin()" 
              class="w-full flex items-center justify-center gap-3 border border-slate-300 hover:border-blue-500 rounded-2xl py-4 mb-3 font-medium">
        <i class="fab fa-google text-xl text-red-500"></i>
        Continue with Google
      </button>

      <div class="text-center text-sm text-slate-500 my-4">OR</div>

      <input id="emailInput" type="email" placeholder="Your Email Address" 
             class="w-full border border-slate-300 rounded-2xl px-5 py-3 mb-3 outline-none">

      <input id="passwordInput" type="password" placeholder="Your Password" 
             class="w-full border border-slate-300 rounded-2xl px-5 py-3 mb-4 outline-none">

      <button onclick="emailLogin()" 
              class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-2xl font-medium">
        Login with Email & Password
      </button>

      <button onclick="hideLoginModal()" class="mt-6 w-full text-slate-500 font-medium">Cancel</button>
    </div>
  </div>

  <script>
    // ==================== VARIABLES ====================
    let isLoggedIn = false;
    let currentUser = {};

    // ==================== FIREBASE SETUP ====================
    const firebaseConfig = {
      apiKey: "AIzaSyCQ1UmTx_FJu0OTMaQvIlecI6CrMdBjYAw",
      authDomain: "trave-chat.firebaseapp.com",
      projectId: "trave-chat",
      storageBucket: "trave-chat.firebasestorage.app",
      messagingSenderId: "456187233290",
      appId: "1:456187233290:web:ab9188ae7baca5af528bf3",
      measurementId: "G-XK27X7DZNW"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // ==================== LOGIN FUNCTIONS ====================
    function googleLogin() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider)
        .then((result) => {
          hideLoginModal();
          completeLogin(result.user);
        })
        .catch((error) => {
          alert("Google login failed: " + error.message);
        });
    }

    function emailLogin() {
      const email = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('passwordInput').value.trim();
      if (!email || !password) {
        alert("Email aur Password dono daalo");
        return;
      }
      auth.signInWithEmailAndPassword(email, password)
        .then((result) => {
          hideLoginModal();
          completeLogin(result.user);
        })
        .catch((error) => {
          alert("Login failed: " + error.message);
        });
    }

    // ==================== UI FUNCTIONS ====================
    function showLoginModal() {
      document.getElementById('loginModal').classList.remove('hidden');
      document.getElementById('loginModal').classList.add('flex');
    }

    function hideLoginModal() {
      const modal = document.getElementById('loginModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function completeLogin(user) {
      isLoggedIn = true;
      currentUser = {
        name: user.displayName || user.email.split('@')[0],
        email: user.email,
        avatar: user.photoURL || (user.displayName ? user.displayName.substring(0,2).toUpperCase() : "👤")
      };

      document.getElementById('loginSection').classList.add('hidden');
      const userSec = document.getElementById('userSection');
      userSec.classList.remove('hidden');
      userSec.classList.add('flex');

      document.getElementById('userName').textContent = currentUser.name;
      document.getElementById('userEmail').textContent = currentUser.email;

      if (user.photoURL) {
        document.getElementById('userAvatar').innerHTML = `<img src="${user.photoURL}" class="w-8 h-8 rounded-full object-cover">`;
      } else {
        document.getElementById('userAvatar').textContent = currentUser.avatar;
      }

      document.getElementById('chatMessages').innerHTML = `
        <div class="flex flex-col items-center justify-center h-full text-center">
          <div class="text-6xl mb-4">✈️</div>
          <h2 class="text-2xl font-semibold">Welcome back, ${currentUser.name.split(' ')[0]}!</h2>
          <p class="text-slate-500 mt-2">Ab travel ke baare mein freely poochho</p>
        </div>`;
    }

    function logout() {
      if (confirm("Logout karna hai?")) {
        auth.signOut().then(() => location.reload());
      }
    }

    // ==================== REAL BACKEND CONNECTION ====================
    async function sendMessage() {
      if (!isLoggedIn) {
        showLoginModal();
        return;
      }

      const input = document.getElementById('userInput');
      const msg = input.value.trim();
      if (!msg) return;

      const chat = document.getElementById('chatMessages');
      
      // User message dikhao
      chat.innerHTML += `
        <div class="flex justify-end">
          <div class="user-bubble message-bubble">${msg}</div>
        </div>`;
      chat.scrollTop = chat.scrollHeight;

      input.value = "";

      try {
        const res = await fetch('http://127.0.0.1:5000/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: msg })
        });

        const data = await res.json();

        chat.innerHTML += `
          <div class="flex justify-start">
            <div class="bot-bubble message-bubble">${data.reply}</div>
          </div>`;
      } catch (error) {
        chat.innerHTML += `
          <div class="flex justify-start">
            <div class="bot-bubble message-bubble text-red-600">
              Backend se connect nahi ho raha.<br>
              Kya <b>app.py</b> chal raha hai?<br>
              <small>Error: ${error.message}</small>
            </div>
          </div>`;
      }

      chat.scrollTop = chat.scrollHeight;
    }

    function newChat() {
      if (!isLoggedIn) {
        showLoginModal();
        return;
      }
      document.getElementById('chatMessages').innerHTML = `
        <div class="flex flex-col items-center justify-center h-full text-center">
          <div class="text-6xl mb-4">✈️</div>
          <h2 class="text-2xl font-semibold">New Journey Started!</h2>
        </div>`;
    }

    function filterHistory() {
      console.log("Searching history...");
    }

    // ==================== INIT ====================
    auth.onAuthStateChanged((user) => {
      if (user) completeLogin(user);
    });

    window.onload = () => {
      console.log("✅ TraveChat loaded successfully with backend connection!");
    };
  </script>
</body>
</html>
